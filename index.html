<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hi Harveen — v1.2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="grid-bg" aria-hidden="true"></div>

    <main class="page" id="page">
      <section class="hero">
        <p class="eyebrow">v1.2</p>
        <h1 class="greeting">
          Hi <span class="name" id="greeting-name">Harveen</span>
        </h1>
      </section>

      <button
        type="button"
        class="btn btn-primary"
        id="reveal-btn"
        aria-expanded="false"
        aria-controls="about-panel"
      >
        Click me to show how I was made
      </button>

      <section class="about-panel" id="about-panel" hidden>
        <div class="about-inner">
          <header class="about-header">
            <h2>Built organically with Cursor</h2>
            <p class="about-intro">
              Scroll left to right — each box is a version in chronological order, from first idea to
              where you are now.
            </p>
          </header>

          <div class="timeline-track">
            <div class="iteration-list" id="iteration-list"></div>
          </div>

          <footer class="git-footer">
            <span class="tag">Git</span>
            <p>
              Commit as <code>v1.2 - horizontal timeline</code>, tag <code>v1.2</code>. Compare
              against snapshots in <code>versions/v1.0/</code> and <code>versions/v1.1/</code>.
            </p>
          </footer>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
