<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connect — Built with Cursor AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;1,9..40,400&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css?v=1.6" />
  </head>
  <body>
    <div class="ai-bg" aria-hidden="true">
      <div class="ai-orb ai-orb-1"></div>
      <div class="ai-orb ai-orb-2"></div>
      <div class="ai-orb ai-orb-3"></div>
      <div class="ai-mesh"></div>
    </div>
    <div class="grid-bg" aria-hidden="true"></div>

    <main class="page page-contact">
      <div class="contact-card panel-box">
        <a href="index.html" class="contact-back">← Back to site</a>

        <header class="contact-header">
          <h1>Connect with me</h1>
          <p>Send a message — include your email so I know how to reach you.</p>
        </header>

        <div class="contact-success" id="contact-success" hidden role="status">
          Message sent. Thanks for reaching out — I'll get back to you soon.
        </div>

        <form
          class="contact-form"
          id="contact-form"
          action="https://formsubmit.co/gsgcursor-connect@mailinator.com"
          method="POST"
        >
          <input type="hidden" name="_subject" value="New message from portfolio site" />
          <input type="hidden" name="_captcha" value="false" />
          <input type="hidden" name="_template" value="table" />
          <input type="hidden" name="_next" id="form-next" value="" />
          <input type="text" name="_honey" class="form-honey" tabindex="-1" autocomplete="off" hidden />

          <div class="form-field">
            <label for="contact-email">Your email</label>
            <input
              type="email"
              id="contact-email"
              name="email"
              placeholder="you@example.com"
              required
              autocomplete="email"
            />
          </div>

          <div class="form-field">
            <label for="contact-message">Message</label>
            <textarea
              id="contact-message"
              name="message"
              placeholder="What would you like to discuss?"
              required
            ></textarea>
          </div>

          <button type="submit" class="contact-submit">Send message</button>
        </form>

        <p class="contact-note">
          Demo inbox: messages go to
          <code>gsgcursor-connect@mailinator.com</code> — view them at
          <a
            href="https://www.mailinator.com/v4/public/inboxes.jsp?to=gsgcursor-connect"
            target="_blank"
            rel="noopener noreferrer"
            >mailinator.com</a
          >
          (public test inbox, no login required).
        </p>
      </div>
    </main>

    <script src="contact.js?v=1.6"></script>
  </body>
</html>
