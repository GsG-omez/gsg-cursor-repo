<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Email Gabriel Gomez</title>
    <meta name="description" content="Reach Gabriel Gomez at gomez.gabe@protonmail.com" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="assets/favicon.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <a class="skip" href="#contact-form">Skip to form</a>
    <div class="contact-page">
      <p class="back"><a href="index.html">← Back to case studies</a></p>
      <h1>Email</h1>
      <p class="lede">
        Write here and your mail app will open a message to
        <a href="mailto:gomez.gabe@protonmail.com">gomez.gabe@protonmail.com</a>.
      </p>
      <form id="contact-form" class="mail-form">
        <label>
          Your name
          <input type="text" name="name" autocomplete="name" required />
        </label>
        <label>
          Your email
          <input type="email" name="from" autocomplete="email" required />
        </label>
        <label>
          Subject
          <input type="text" name="subject" required />
        </label>
        <label>
          Message
          <textarea name="body" rows="8" required></textarea>
        </label>
        <button type="submit">Open email</button>
      </form>
    </div>
    <script>
      document.getElementById("contact-form").addEventListener("submit", function (e) {
        e.preventDefault();
        var d = new FormData(e.target);
        var name = String(d.get("name") || "").trim();
        var from = String(d.get("from") || "").trim();
        var subject = String(d.get("subject") || "").trim();
        var body = String(d.get("body") || "").trim();
        var lines = body + "\n\n— " + name + " (" + from + ")";
        var href =
          "mailto:gomez.gabe@protonmail.com" +
          "?subject=" +
          encodeURIComponent(subject) +
          "&body=" +
          encodeURIComponent(lines);
        window.location.href = href;
      });
    </script>
  </body>
</html>
